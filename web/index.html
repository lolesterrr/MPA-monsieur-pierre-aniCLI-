<body data-view="home">
<a class="skip-link" href="#view">Skip to content</a>
<header class="top">
  <a class="brand" href="#/" aria-label="MPA, home">
    <span data-pierre="beret" data-scale="2"></span>
    <span class="wordmark" aria-hidden="true">MPA</span>
  </a>
  <form class="top-search" role="search" data-search>
    <label class="sr" for="top-q">Search anime</label>
    <input id="top-q" type="search" name="q" placeholder="Search anime" autocomplete="off" enterkeyhint="search">
    <button class="btn" type="submit">Search</button>
  </form>
  <button class="btn complain" type="button" data-complain>Complain</button>
</header>

<main id="view" tabindex="-1">
  <noscript><p>MPA needs JavaScript to search and play episodes.</p></noscript>
</main>

<footer class="foot">
  <p>MPA is a web GUI for <a href="https://github.com/pystardust/ani-cli">ani-cli</a>. It doesn't host any video: streams come from third-party sites through MPA's worker.</p>
  <p class="foot-links">
    <a href="https://github.com/lolesterrr/MPA-monsieur-pierre-aniCLI-">Source on GitHub</a>
    <button class="link-btn" type="button" data-backstage>Backstage</button>
    <button class="link-btn" type="button" data-complain>Complain</button>
  </p>
</footer>
