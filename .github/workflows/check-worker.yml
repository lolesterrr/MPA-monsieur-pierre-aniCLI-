# A button for "is the worker OK?": Actions > Check the worker > Run workflow.
# It walks the whole path a viewer takes, using the worker address in web/config.js:
# health, search, episodes, stream links, then the playlist, a video segment and the
# subtitles through the relay. The first step that goes red is where it breaks.
name: Check the worker

on:
  workflow_dispatch:
    inputs:
      query:
        description: Anime to search for
        default: one piece film red

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      QUERY: ${{ inputs.query || 'one piece film red' }}
    steps:
      - uses: actions/checkout@v7

      - name: Worker address
        run: |
          api=$(sed -nE 's|^[[:space:]]*api: "([^"]+)".*|\1|p' web/config.js)
          echo "Using $api"
          echo "API=$api" >> "$GITHUB_ENV"

      - name: Health
        run: |
          curl -sSf "$API/api/health?deep=1" | tee health.json; echo
          jq -e '.signing == true' health.json > /dev/null || { echo "::error::SIGNING_KEY is missing"; exit 1; }
          jq -e '.upstream == "ok"' health.json > /dev/null || { echo "::error::hianime said no: $(jq -r .upstreamMessage health.json)"; exit 1; }

      - name: Search
        run: |
          curl -sSf -G "$API/api/search" --data-urlencode "q=$QUERY" > search.json
          jq -r '.results[:5][] | "\(.id)  \(.title)"' search.json
          id=$(jq -r '.results[0].id // empty' search.json)
          [ -n "$id" ] || { echo "::error::No results for $QUERY"; exit 1; }
          echo "ID=$id" >> "$GITHUB_ENV"

      - name: Episodes
        run: |
          curl -sSf "$API/api/episodes?id=$ID" > eps.json
          echo "$(jq '.episodes | length' eps.json) episodes"
          ep=$(jq -r '.episodes[0].id // empty' eps.json)
          [ -n "$ep" ] || { echo "::error::No episodes for $ID"; exit 1; }
          echo "EP=$ep" >> "$GITHUB_ENV"

      - name: Stream links
        run: |
          curl -sS "$API/api/sources?id=$ID&epId=$EP&mode=sub" > src.json
          jq '{available, malId, subtitles: [.subtitles[]? | .label], error, message}' src.json
          jq -e '.master' src.json > /dev/null || { echo "::error::$(jq -r .message src.json)"; exit 1; }

      - name: Playlist through the relay
        run: |
          curl -sSf "$(jq -r .master src.json)" > master.m3u8
          head -c 300 master.m3u8 | sed -E 's|t=[^&]*|t=...|g'; echo
          grep -q '^#EXTM3U' master.m3u8 || { echo "::error::The master playlist isn't a playlist"; exit 1; }
          variant=$(grep -m1 '^http' master.m3u8)
          curl -sSf "$variant" > media.m3u8
          seg=$(grep -m1 '^http' media.m3u8)
          [ -n "$seg" ] || { echo "::error::No segments in the media playlist"; exit 1; }
          echo "SEG=$seg" >> "$GITHUB_ENV"

      - name: A video segment through the relay
        run: |
          curl -sS -o seg.bin -w "HTTP %{http_code}, %{size_download} bytes, %{content_type}\n" "$SEG" | tee seg.txt
          grep -q "HTTP 200" seg.txt || { echo "::error::The stream host refused the segment"; exit 1; }
          [ "$(stat -c %s seg.bin)" -gt 1000 ] || { echo "::error::The segment is suspiciously small"; exit 1; }

      - name: Subtitles through the relay
        run: |
          sub=$(jq -r '.subtitles[0].url // empty' src.json)
          if [ -z "$sub" ]; then echo "No subtitles for this one"; exit 0; fi
          curl -sSf "$sub" | head -3
